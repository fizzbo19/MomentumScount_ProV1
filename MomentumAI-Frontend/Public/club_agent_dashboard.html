<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MomentumScout V1 — Club & Agent Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Analytics Tab -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #0d1117;
        color: #c9d1d9;
      }
      .attribute-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: #21262d;
        outline: none;
        border-radius: 6px;
        transition: opacity 0.12s;
      }
      .attribute-slider:hover {
        opacity: 1;
      }
      .attribute-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #22c55e;
        border-radius: 50%;
        cursor: pointer;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(2, 6, 23, 0.8);
        overflow: auto;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top: 4px solid #22c55e;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .top-five {
        box-shadow: 0 8px 30px rgba(250, 204, 21, 0.08);
        border: 2px solid #facc15;
        transform: scale(1.02);
      }
      .fade-in {
        animation: fadeIn 0.24s ease-in-out both;
      }
      .value-input {
        background: #111827;
        border: 1px solid #374151;
        padding: 8px;
        border-radius: 6px;
        width: 100%;
        color: #c9d1d9;
      }

      /* Tab Styles */
      .tab-button {
        transition: background 0.2s, color 0.2s;
        border-bottom: 2px solid transparent;
      }
      .tab-button.active {
        background: #22c55e;
        color: #0d1117;
        font-weight: 700;
        border-radius: 6px 6px 0 0;
      }
      .tab-pane {
        min-height: 400px;
      }

      /* Reporting Styles */
      table.stats-table th,
      table.stats-table td {
        border-bottom: 1px solid #1f2937;
        padding: 8px 0;
        font-size: 0.875rem;
      }
      table.stats-table th {
        text-align: left;
        color: #a1a1aa;
        font-weight: 400;
      }
      table.projection-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      table.projection-table th,
      table.projection-table td {
        border: 1px solid #2b3138;
        padding: 6px;
        text-align: center;
        font-size: 0.9rem;
      }
      table.projection-table th {
        color: #facc15;
        background: #0f1724;
      }

      .ai-suggestion {
        border-left: 4px solid #facc15;
        background: #111827;
        padding: 12px;
        border-radius: 8px;
      }
      .report-box {
        background: #1f2937;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        border: 1px solid #374151;
      }
      .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
      }
    </style>
  </head>

    <script>
      /* ------------- CONFIGURATION ------------- */
      const BACKEND_BASE = "https://momentumscount-prov1-1.onrender.com/api";
      const DEFAULT_VALUE_MIN = 100000;
      const DEFAULT_VALUE_MAX = 50000000;
      let currentChart = null;
      let currentTargets = [];

      /* ------------- GLOBAL ELEMENTS ------------- */
      let posSelect,
        coreSliders,
        dynMetrics,
        weightContainer,
        recommendations,
        loadingIndicator;
      let playerNameSearch,
          playerSearchResults,
        searchStatus,
        modal,
        modalInner,
        closeModal;
      let findBtn,
        resetBtn,
        searchBtn,
        analyzeSquadBtn,
        targetPlayersBtn,
        squadPositionSelect;
      let detailedStatsTable, trainingRegime;

      /* --- HELPER FUNCTIONS --- */
      function niceName(key) {
        return key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      }
      function fmtGBPFromEur(eur) {
        if (!eur) return "£0.0M";
        const gbp = eur * 0.85;
        if (gbp >= 1_000_000) return `£${(gbp / 1_000_000).toFixed(2)}M`;
        return `£${(gbp / 1000).toFixed(0)}k`;
      }

      async function safePost(endpoint, body) {
        try {
          const resp = await fetch(BACKEND_BASE + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            mode: "cors",
          });
          if (!resp.ok) throw new Error(`Backend Status ${resp.status}`);
          return await resp.json();
        } catch (err) {
          console.error(err);
          throw err;
        }
      }

      /* --- TAB LOGIC --- */
      function switchTab(targetId) {
        document
          .querySelectorAll(".tab-button")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-pane")
          .forEach((p) => p.classList.add("hidden"));

        const activeBtn = document.querySelector(`[data-tab="${targetId}"]`);
        if (activeBtn) activeBtn.classList.add("active");

        const targetPane = document.getElementById(targetId);
        if (targetPane) targetPane.classList.remove("hidden");
      }

      /* --- SETUP --- */
      function setupEventListeners() {
  closeModal.onclick = () => (modal.style.display = "none");

  window.onclick = (e) => {
    if (e.target === modal) modal.style.display = "none";
  };

  document.getElementById("backToScouting").onclick = () => switchTab("scouting");

  document
    .querySelectorAll(".tab-button")
    .forEach((tab) => (tab.onclick = () => switchTab(tab.dataset.tab)));

  findBtn.onclick = handleFindPlayers;
  searchBtn.onclick = handleSearchPlayers;
  resetBtn.onclick = resetAll;
  analyzeSquadBtn.onclick = handleSquadAnalysis;
  targetPlayersBtn.onclick = handleBudgetTargeting;

  document.getElementById("exportTargetsBtn").onclick = handleExportCSV;
  document.getElementById("saveTargetsBtn").onclick = handleSaveToProfile;
  document.getElementById("loadTargetsBtn").onclick = handleLoadSavedTargets;
  document.getElementById("clearShortlistBtn").onclick = handleClearShortlist;
  document.getElementById("exportPdfBtn").onclick = handleExportPDF;

  posSelect.onchange = updateUIAfterPositionChange;
}


      /* --- DATA HANDLERS --- */
      async function handleFindPlayers() {
        recommendations.innerHTML = '<div class="spinner mx-auto"></div>';

        const body = {
          position: posSelect.value,
          filters: {},
          weights: {},
          data_source: "base",
        };

        body.filters["overall"] = [
          Number(document.getElementById("Overall_min").value),
          Number(document.getElementById("Overall_max").value),
        ];
        body.filters["age"] = [
          Number(document.getElementById("Age_min").value),
          Number(document.getElementById("Age_max").value),
        ];
        body.filters["value_eur"] = [
          Number(document.getElementById("Value_min").value),
          Number(document.getElementById("Value_max").value),
        ];

        safePost("/find_players", body).then((data) => {
          recommendations.innerHTML = "";
          if (!data?.players?.length)
            return (recommendations.innerHTML =
              '<p class="text-gray-500">No players found.</p>');
          data.players.forEach((p) =>
            recommendations.appendChild(renderPlayerCard(p))
          );
        });
      }

      async function handleSearchPlayers() {
        const q = playerNameSearch.value.trim();
        if (!q) return;

        playerSearchResults.innerHTML = '<div class="spinner"></div>';
        safePost("/search_player", { player_name: q }).then((data) => {
          playerSearchResults.innerHTML = "";
          data?.forEach((pl) =>
            playerSearchResults.appendChild(renderPlayerCard(pl))
          );
        });
      }

      async function handleBudgetTargeting() {
  const list = document.getElementById("targetResults");
  list.innerHTML =
    '<div class="flex justify-center py-10"><div class="spinner"></div></div>';

  try {
    const data = await safePost("/budget_target", {
      max_wage: document.getElementById("maxWage").value,
      contract_year: document.getElementById("contractYear").value
    });

    // ✅ NORMALIZE TARGET DATA
    currentTargets = (data.targets || []).map((p) => ({
      ...p,
      full_attributes: p.full_attributes || p.full_stats || {}
    }));

    if (currentTargets.length === 0) {
      list.innerHTML =
        '<p class="text-center text-gray-500 mt-10">No players found matching these financial constraints.</p>';
      return;
    }

    // ✅ RENDER TARGETS (clickable)
    list.innerHTML = currentTargets
      .map(
        (p, i) => `
        <div
          class="flex justify-between items-center p-3 bg-gray-800 rounded border border-gray-700 mb-2 cursor-pointer hover:border-green-500"
          onclick="loadPlayerDetails(currentTargets[${i}]); switchTab('analytics');"
        >
          <div>
            <div class="text-sm font-bold text-green-400">${p.short_name}</div>
            <div class="text-xs text-gray-500">
              Exp: ${p.contract_end} | ${fmtGBPFromEur(p.wage_yearly)}/yr
            </div>
          </div>
          <div class="text-lg font-bold text-white">${p.overall}</div>
        </div>
      `
      )
      .join("");
  } catch (err) {
    console.error("Targeting Error:", err);
    list.innerHTML =
      '<p class="text-red-500 text-center mt-10">Error connecting to scouting server.</p>';
  }
}


      function renderPlayerCard(player) {
        const card = document.createElement("div");
        card.className =
          "bg-gray-800 p-4 rounded-xl border border-gray-700 hover:scale-105 transition-transform cursor-pointer";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${player.player_face_url}" class="w-16 h-16 rounded-full border-2 border-green-500 object-cover">
            <div class="flex-1">
              <div class="font-bold text-green-300">${player.short_name}</div>
              <div class="text-xs text-gray-400">${player.club_position} • OVR ${player.overall}</div>
            </div>
          </div>
        `;
        card.onclick = () => loadPlayerDetails(player);
        return card;
        }

      function loadPlayerDetails(player) {
        document.getElementById(
          "analyticsHeader"
        ).textContent = `${player.short_name} - Advanced Analytics`;

        const attrs = player.full_attributes || {};
        detailedStatsTable.innerHTML =
          `<table class="stats-table w-full"><tbody>` +
          Object.keys(attrs)
            .map((k) => `<tr><th>${niceName(k)}</th><td>${attrs[k]}</td></tr>`)
            .join("") +
          `</tbody></table>`;

        // Radar Data (Fixed keys for CSV)
        const data = [
          attrs.pace || 50,
          attrs.shooting || 50,
          attrs.passing || 50,
          attrs.dribbling || 50,
          attrs.defending || 50,
          attrs.physic || 50,
        ];

        if (currentChart) currentChart.destroy();
        const ctx = document.getElementById("performanceChart").getContext("2d");

        currentChart = new Chart(ctx, {
          type: "radar",
          data: {
            labels: ["PAC", "SHO", "PAS", "DRI", "DEF", "PHY"],
            datasets: [
              {
                label: player.short_name,
                data: data,
                backgroundColor: "rgba(34,197,94,0.2)",
                borderColor: "#22c55e",
              },
            ],
          },
          options: { scales: { r: { suggestedMin: 30, suggestedMax: 100 } } },
        });

        // Premium Gating
        const entitlements = JSON.parse(
          sessionStorage.getItem("momentum_entitlements") ||
            '{"analyst_ai":false}'
        );

        if (entitlements.analyst_ai) {
          const ai = player.ai_training || { weakness: "N/A", drills: [] };
          trainingRegime.innerHTML = `<div class="report-box"><strong>Weakness:</strong> ${ai.weakness}<br><strong>Drills:</strong> ${ai.drills.join(
            ", "
          )}</div>`;
        } else {
          trainingRegime.innerHTML = `<div class="bg-black/50 p-4 rounded text-center">🔒 Upgrade to unlock AI Insights</div>`;
        }

        switchTab("analytics");
      }

      /* --- EXPORT / SAVING LOGIC --- */
      function handleExportCSV() {
        if (!currentTargets.length) return alert("Find targets first.");
        let csv =
          "Name,Position,Overall,Wage,Contract\n" +
          currentTargets
            .map(
              (p) =>
                `${p.short_name},${p.club_position},${p.overall},${p.wage_yearly},${p.contract_end}`
            )
            .join("\n");

        const blob = new Blob([csv], { type: "text/csv" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "MomentumTargets.csv";
        a.click();
      }

      function handleSaveToProfile() {
        if (!currentTargets.length) return alert("Find targets first.");
        localStorage.setItem("saved_targets", JSON.stringify(currentTargets));
        alert("Targets saved!");
        handleLoadSavedTargets();
      }

      function handleLoadSavedTargets() {
        const saved = JSON.parse(localStorage.getItem("saved_targets") || "[]");
        const container = document.getElementById("savedTargetsList");
        if (!saved.length)
          return (container.innerHTML =
            '<p class="text-xs text-gray-600 italic">Empty</p>');

        container.innerHTML = saved
          .map(
            (p, i) => `
              <div class="flex justify-between items-center p-2 bg-blue-900/10 border border-blue-500/20 rounded">
                <span class="text-xs font-bold text-blue-300">${p.short_name}</span>
                <div class="flex gap-1">
                  <button onclick="compareFromShortlist(${i})" class="text-green-500">⚡</button>
                  <button onclick="removeSinglePlayer(${i})" class="text-red-500">×</button>
                </div>
              </div>
            `
          )
          .join("");
      }

      function removeSinglePlayer(i) {
        const saved = JSON.parse(localStorage.getItem("saved_targets") || "[]");
        saved.splice(i, 1);
        localStorage.setItem("saved_targets", JSON.stringify(saved));
        handleLoadSavedTargets();
      }

      function handleClearShortlist() {
        localStorage.removeItem("saved_targets");
        handleLoadSavedTargets();
      }

function compareFromShortlist(index) {
const saved = JSON.parse(localStorage.getItem("saved_targets") || "[]");
const player = saved[index] || currentTargets[index];
if (!player) return;

  // If analytics tab is hidden, load first player normally
  if (document.getElementById("analytics").classList.contains("hidden")) {
    loadPlayerDetails(player);
    alert(
      "Primary player loaded. Click another player's ⚡ icon to overlay comparison data."
    );
    return;
  }

  // Add comparison dataset to existing radar chart
  if (currentChart) {
    const stats = player.full_attributes || {};

    const comparisonData = [
      stats.pace || 50,
      stats.shooting || 50,
      stats.passing || 50,
      stats.dribbling || 50,
      stats.defending || 50,
      stats.physic || stats.physicality || 50,
    ];

    currentChart.data.datasets.push({
      label: `${player.short_name} (Comparison)`,
      data: comparisonData,
      backgroundColor: "rgba(250, 204, 21, 0.2)",
      borderColor: "#facc15",
      pointBackgroundColor: "#fff",
    });

    currentChart.update();

    document.getElementById("analyticsHeader").textContent =
      "Player Head-to-Head Comparison";

    switchTab("analytics");
  }
}
