    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #0d1117;
        color: #c9d1d9;
      }
      .attribute-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: #21262d;
        outline: none;
        border-radius: 6px;
        transition: opacity 0.12s;
      }
      .attribute-slider:hover {
        opacity: 1;
      }
      .attribute-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #22c55e;
        border-radius: 50%;
        cursor: pointer;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(2, 6, 23, 0.8);
        overflow: auto;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top: 4px solid #22c55e;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .top-five {
        box-shadow: 0 8px 30px rgba(250, 204, 21, 0.08);
        border: 2px solid #facc15;
        transform: scale(1.02);
      }
      .fade-in {
        animation: fadeIn 0.24s ease-in-out both;
      }
      .value-input {
        background: #111827;
        border: 1px solid #374151;
        padding: 8px;
        border-radius: 6px;
        width: 100%;
        color: #c9d1d9;
      }

      /* Tab Styles */
      .tab-button {
        transition: background 0.2s, color 0.2s;
        border-bottom: 2px solid transparent;
      }
      .tab-button.active {
        background: #22c55e;
        color: #0d1117;
        font-weight: 700;
        border-radius: 6px 6px 0 0;
      }
      .tab-pane {
        min-height: 400px;
      }

      /* Reporting Styles */
      table.stats-table th,
      table.stats-table td {
        border-bottom: 1px solid #1f2937;
        padding: 8px 0;
        font-size: 0.875rem;
      }
      table.stats-table th {
        text-align: left;
        color: #a1a1aa;
        font-weight: 400;
      }
      table.projection-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      table.projection-table th,
      table.projection-table td {
        border: 1px solid #2b3138;
        padding: 6px;
        text-align: center;
        font-size: 0.9rem;
      }
      table.projection-table th {
        color: #facc15;
        background: #0f1724;
      }

      .ai-suggestion {
        border-left: 4px solid #facc15;
        background: #111827;
        padding: 12px;
        border-radius: 8px;
      }
      .report-box {
        background: #1f2937;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        border: 1px solid #374151;
      }
      .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
      }
    </style>

        /* --- VISUAL METER (✅ add once) --- */
        function meterHTML(label, val, bandText = "") {
          const v = Math.max(0, Math.min(100, Number(val || 0)));
          const band = bandText
            ? `<span class="text-xs text-gray-400 ml-2">${bandText}</span>`
            : "";
          return `
            <div class="mb-3">
              <div class="flex justify-between text-xs text-gray-300 mb-1">
                <div>${label}${band}</div>
                <div class="font-bold">${v}</div>
              </div>
              <div class="w-full bg-gray-700 rounded h-2">
                <div class="bg-green-500 h-2 rounded" style="width:${v}%"></div>
              </div>
            </div>
          `;
        }
      
        function clubStyleLabel(player) {
          // optional: show what style was used if your backend returns it
          const style =
            (player?.deal_intel?.club_style || player?.club_style || "").toString();
          return style ? style : "";
        }
      
        /* --- HELPER FUNCTIONS --- */
        function niceName(key) {
          if (!key) return "";
          return key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
        }
      
        function fmtGBPFromEur(eur) {
          if (!eur) return "£0.0M";
          const gbp = eur * 0.85;
          if (gbp >= 1_000_000) return `£${(gbp / 1_000_000).toFixed(2)}M`;
          return `£${(gbp / 1000).toFixed(0)}k`;
        }
      
        async function safePost(endpoint, body) {
          const resp = await fetch(BACKEND_BASE + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            mode: "cors",
          });
      
          // helpful error details for debugging
          if (!resp.ok) {
            const txt = await resp.text().catch(() => "");
            console.error("Backend error:", resp.status, txt);
            throw new Error(`Backend Status ${resp.status}`);
          }
      
          // some endpoints might return empty, but yours should return JSON
          return await resp.json();
        }
      
        /* --- TAB LOGIC --- */

            .forEach((t) => t.classList.remove("active"));

            .forEach((p) => p.classList.add("hidden"));
      
          const activeBtn = document.querySelector(`[data-tab="${targetId}"]`);
          if (activeBtn) activeBtn.classList.add("active");
      
          const targetPane = document.getElementById(targetId);
          if (targetPane) targetPane.classList.remove("hidden");
        }

        function populatePositionOptions() {
          const options = [

            ["RB", "Right Back"],
            ["LB", "Left Back"],
            ["CB", "Centre Back"],
            ["CDM", "Defensive Midfielder"],
            ["CM", "Midfielder"],
            ["CAM", "Attacking Midfielder"],
            ["RW", "Right Winger"],
            ["LW", "Left Winger"],
            ["CF", "Centre Forward"],
            ["ST", "Striker"],
          ];
      
          posSelect.innerHTML = options
            .map(([v, label]) => `<option value="${v}">${label}</option>`)
            .join("");
          posSelect.value = "GK";

            <div class="fade-in">
              <label class="block text-sm mb-1">Value (M£): <span id="valueValue" class="text-gray-300">1 - 50</span></label>
              <input type="range" id="value_min" min="0.1" max="999" step="0.1" value="1" class="attribute-slider w-full mb-2">
              <input type="range" id="value_max" min="0.1" max="999" step="0.1" value="50" class="attribute-slider w-full">
            </div>
          `;
        }
      
        function buildPositionMetrics(position) {
          const metrics = POSITION_METRICS[position]?.display || [];
          dynMetrics.innerHTML = "";
      
          metrics.forEach((m) => {
            dynMetrics.innerHTML += `
              <div class="fade-in">
                <label class="block text-sm mb-1">
                  ${niceName(m)}: <span id="${m}Value" class="text-gray-300">0 - 99</span>
                </label>
                <input id="${m}_min" class="attribute-slider w-full mb-2" type="range" min="0" max="99" value="0">
                <input id="${m}_max" class="attribute-slider w-full" type="range" min="0" max="99" value="99">
              </div>
            `;
          });
        }
      
        function buildWeightSliders(position) {
          const weights = POSITION_METRICS[position]?.weights || [];
          let html = `<h4 class="text-sm font-bold text-gray-300 mb-4">Attribute Weighting</h4>`;
      
          if (position === "GK") {
            html += `<p class="text-xs text-center text-gray-500">Goalkeeper attributes are not weighted for scouting score.</p>`;
            weightContainer.innerHTML = html;
            return;
          }
      
          weights.forEach((m) => {
            const spanId = `weight${m.charAt(0).toUpperCase() + m.slice(1)}Value`;
            html += `
              <div class="fade-in">
                <label class="block text-sm mb-1">
                  ${niceName(m)} Desire: <span id="${spanId}" class="text-gray-300">0</span>
                </label>
                <input id="weight_${m}" class="attribute-slider w-full" type="range" min="0" max="100" value="0">
              </div>
            `;
          });
      
          weightContainer.innerHTML = html;
        }
      
        function setupSliderListeners() {
          const sliders = document.querySelectorAll('input[type="range"]');
          sliders.forEach((s) => s.addEventListener("input", updateSliderValues));
          updateSliderValues();
        }
      
        function clampMinMax(minEl, maxEl) {
          if (!minEl || !maxEl) return;
          if (Number(minEl.value) > Number(maxEl.value)) maxEl.value = minEl.value;
        }
      
        function updateSliderValues() {
          const corePairs = [
            ["overall_min", "overall_max", "overallValue"],
            ["age_min", "age_max", "ageValue"],
            ["value_min", "value_max", "valueValue"],
          ];
      
          corePairs.forEach(([minId, maxId, spanId]) => {
            const minEl = document.getElementById(minId);
            const maxEl = document.getElementById(maxId);
            const span = document.getElementById(spanId);
            clampMinMax(minEl, maxEl);
            if (minEl && maxEl && span) span.textContent = `${minEl.value} - ${maxEl.value}`;
          });
      
          document.querySelectorAll('input[id$="_min"]').forEach((minEl) => {
            const maxEl = document.getElementById(minEl.id.replace("_min", "_max"));
            const span = document.getElementById(minEl.id.replace("_min", "Value"));
      
            if (["overall_min", "age_min", "value_min"].includes(minEl.id)) return;
      
            clampMinMax(minEl, maxEl);
            if (span && maxEl) span.textContent = `${minEl.value} - ${maxEl.value}`;
          });
      
          document.querySelectorAll('input[id^="weight_"]').forEach((wEl) => {
            const metric = wEl.id.replace("weight_", "");
            const spanId = `weight${metric.charAt(0).toUpperCase() + metric.slice(1)}Value`;
            const span = document.getElementById(spanId);
            if (span) span.textContent = wEl.value;
          });
        }
      
        function updateUIAfterPositionChange() {
          buildPositionMetrics(posSelect.value);
          buildWeightSliders(posSelect.value);
          setupSliderListeners();
        }
      
        function resetAll() {
          buildCoreSliders();
          updateUIAfterPositionChange();
          recommendations.innerHTML = "";
        }
      
        /* --- DATA HANDLERS (unchanged except loadPlayerDetails gets advanced meters) --- */
      
        async function handleBudgetTargeting() {
          const list = document.getElementById("targetResults");
          list.innerHTML = '<div class="flex justify-center py-10"><div class="spinner"></div></div>';
      
          try {
            const data = await safePost("/budget_target", {
              max_wage: document.getElementById("maxWage").value,
              contract_year: document.getElementById("contractYear").value,
            });
      
            currentTargets = (data.targets || []).map((p) => ({
                     ...p,
            full_attributes: p.full_attributes || p.full_stats || {},
             // keep these in case your backend returns them for budget targets
            fit_score: p.fit_score ?? 0,
             momentum: p.momentum ?? null,
            risk_profile: p.risk_profile ?? null,
            deal_intel: p.deal_intel ?? null,           
            }));


      
            if (currentTargets.length === 0) {
              list.innerHTML =
                '<p class="text-center text-gray-500 mt-10">No players found matching these financial constraints.</p>';
              return;
            }
      
            list.innerHTML = currentTargets
              .map(
                (p, i) => `
                <div
                  class="flex justify-between items-center p-3 bg-gray-800 rounded border border-gray-700 mb-2 cursor-pointer hover:border-green-500"
                  onclick="loadPlayerDetails(currentTargets[${i}]);"
                >
                  <div>
                    <div class="text-sm font-bold text-green-400">${p.short_name}</div>
                    <div class="text-xs text-gray-500">
                      Exp: ${p.contract_end} | ${fmtGBPFromEur(p.wage_yearly)}/yr
                    </div>
                  </div>
                  <div class="text-lg font-bold text-white">${p.overall}</div>
                </div>
              `
              )
              .join("");
          } catch (err) {
            console.error("Targeting Error:", err);
            list.innerHTML =
              '<p class="text-red-500 text-center mt-10">Error connecting to scouting server.</p>';
          }
        }
      
        function renderPlayerCard(player) {
          const attrs = player.full_attributes || {};
          const overall = player.overall ?? attrs.overall ?? "";
          const face = player.player_face_url ?? attrs.player_face_url ?? "";
      
          const card = document.createElement("div");
          card.className =
            "bg-gray-800 p-4 rounded-xl border border-gray-700 hover:scale-105 transition-transform cursor-pointer";
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="${face}" class="w-16 h-16 rounded-full border-2 border-green-500 object-cover" onerror="this.style.display='none'">
              <div class="flex-1">
                <div class="font-bold text-green-300">${player.short_name || player.name || "Unknown"}</div>
                <div class="text-xs text-gray-400">${player.club_position} ${overall ? `• OVR ${overall}` : ""}</div>
              </div>
            </div>
          `;
          card.onclick = () => loadPlayerDetails(player);
          return card;
        }
      
        function pickStat(attrs, keys, fallback = 50) {
          for (const k of keys) {
            const v = attrs?.[k];
            if (typeof v === "number" && !Number.isNaN(v)) return v;
          }
          return fallback;
        }
      
        function loadPlayerDetails(player) {
  // grab once + clear
  const insightsBox = document.getElementById("advancedInsights");
  if (insightsBox) insightsBox.innerHTML = "";

  // header
  document.getElementById("analyticsHeader").textContent =
    `${player.short_name || player.name || "Player"} - Advanced Analytics`;

  const attrs = player.full_attributes || {};

  // stats table
  detailedStatsTable.innerHTML =
    `<table class="stats-table w-full"><tbody>` +
    Object.keys(attrs)
      .map((k) => `<tr><th>${niceName(k)}</th><td>${attrs[k]}</td></tr>`)
      .join("") +
    `</tbody></table>`;

  // radar chart
  const radarData = [
    pickStat(attrs, ["pace", "pac"]),
    pickStat(attrs, ["shooting", "sho"]),
    pickStat(attrs, ["passing", "pas"]),
    pickStat(attrs, ["dribbling", "dri"]),
    pickStat(attrs, ["defending", "defence", "def", "dfs"]),
    pickStat(attrs, ["physic", "physicality", "physical", "phy"]),
  ];

  if (currentChart) currentChart.destroy();
  const ctx = document.getElementById("performanceChart").getContext("2d");

  currentChart = new Chart(ctx, {
    type: "radar",
    data: {
      labels: ["PAC", "SHO", "PAS", "DRI", "DEF", "PHY"],
      datasets: [
        {
          label: player.short_name || player.name || "Player",
          data: radarData,
          backgroundColor: "rgba(34,197,94,0.2)",
          borderColor: "#22c55e",
        },
      ],
    },
    options: { scales: { r: { suggestedMin: 30, suggestedMax: 100 } } },
  });

  // premium gating
  const entitlements = JSON.parse(
    sessionStorage.getItem("momentum_entitlements") || '{"analyst_ai":false}'
  );

  // training regime (premium)
  if (entitlements.analyst_ai) {
    const ai = player.ai_training || { weakness: "N/A", drills: [] };
    trainingRegime.innerHTML = `
      <div class="report-box">
        <strong>Weakness:</strong> ${ai.weakness || "N/A"}<br>
        <strong>Drills:</strong> ${(ai.drills || []).join(", ") || "N/A"}
      </div>
    `;
  } else {
    trainingRegime.innerHTML =
      `<div class="bg-black/50 p-4 rounded text-center">🔒 Upgrade to unlock AI Insights</div>`;
  }

  // ✅ Advanced Insights (Fit / Momentum / Risk / Similar / Deal)
  if (insightsBox) {
    const fit = Number(player.fit_score ?? 0);

    const mom = player.momentum ?? {
      score: Number(player.momentum_score ?? 0),
      label: "Stable",
      arrow: "flat",
    };

    const risk = player.risk_profile ?? {};
    const deal = player.deal_intel ?? {};
    const sims = Array.isArray(player.similar_players) ? player.similar_players : [];

    const arrow = mom.arrow === "up" ? "↑" : mom.arrow === "down" ? "↓" : "→";

    // support both ai_suggestion (string) and ai_suggestions (array)
    const riskSuggestionText = (risk.ai_suggestion || "").toString();
    const riskSuggestions = Array.isArray(risk.ai_suggestions) ? risk.ai_suggestions : [];

    insightsBox.innerHTML = `
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4">
        <div class="text-sm font-bold text-green-300 mb-3">Advanced Insights</div>

        <!-- 1) Fit Score -->
        ${meterHTML("Fit Score", fit, clubStyleLabel(player))}

        <!-- 2) Momentum Trend -->
        <div class="flex justify-between items-center text-xs text-gray-300 mt-3">
          <div>Momentum Trend <span class="text-gray-500 ml-2">${mom.label || ""}</span></div>
          <div class="font-bold text-white">${arrow} ${Number(mom.score || 0)}</div>
        </div>
        <div class="w-full bg-gray-700 rounded h-2 mt-2">
          <div class="bg-green-500 h-2 rounded" style="width:${Math.max(0, Math.min(100, Number(mom.score || 0)))}%"></div>
        </div>

        <!-- 3) Risk Profile -->
        <div class="mt-5">
          <div class="text-xs font-bold text-green-300 mb-2">Risk Profile</div>
          ${meterHTML("Injury Risk", Number(risk.injury_risk ?? 0), risk.injury_band || "")}
          ${meterHTML("Contract Risk", Number(risk.contract_risk ?? 0), risk.contract_band || "")}
          ${meterHTML("Wage Risk", Number(risk.wage_risk ?? 0), risk.wage_band || "")}

          ${
            (riskSuggestionText || riskSuggestions.length)
              ? `<div class="text-xs text-gray-300 mt-2 bg-black/30 p-3 rounded border border-gray-700">
                   <span class="text-green-300 font-bold">AI Suggestions:</span>
                   ${
                     riskSuggestions.length
                       ? `<ul class="list-disc ml-5 mt-2 text-gray-400">
                            ${riskSuggestions.map(x => `<li>${x}</li>`).join("")}
                          </ul>`
                       : `<div class="text-gray-400 mt-2">${riskSuggestionText}</div>`
                   }
                 </div>`
              : ""
          }
        </div>

        <!-- 4) Similar Players -->
        <div class="mt-5">
          <div class="text-xs font-bold text-green-300 mb-2">Similar Players (Plan B)</div>
          <div class="space-y-2">
            ${
              sims.length
                ? sims.map(s => `
                    <div class="flex justify-between items-center bg-gray-800 border border-gray-700 rounded p-2">
                      <div>
                        <div class="text-sm font-bold text-white">${s.short_name || "Unknown"}</div>
                        <div class="text-xs text-gray-400">
                          ${s.club_position || ""} • Sim ${Math.round((Number(s.similarity || 0)) * 100)}%
                        </div>
                      </div>
                      <div class="text-sm font-bold text-green-400">${s.overall ?? ""}</div>
                    </div>
                  `).join("")
                : `<div class="text-sm text-gray-400">No similar players found.</div>`
            }
          </div>
        </div>

        <!-- 5) Deal Intelligence -->
        <div class="mt-5">
          <div class="text-xs font-bold text-green-300 mb-2">Deal Intelligence</div>
          <div class="text-sm text-gray-300 space-y-1">
            <div>Contract End: <span class="text-white font-bold">${deal.contract_end_year || "N/A"}</span></div>
            <div>Leverage: <span class="text-white font-bold">${deal.leverage || "Unknown"}</span></div>
            <div>Release Clause: <span class="text-white font-bold">${fmtGBPFromEur(deal.release_clause_eur || 0)}</span></div>
            ${deal.clause_note ? `<div class="text-xs text-gray-400 mt-2">${deal.clause_note}</div>` : ""}
            ${deal.ai_note ? `<div class="text-xs text-gray-400 mt-2">${deal.ai_note}</div>` : ""}
          </div>
        </div>
      </div>
    `;
  }

  switchTab("analytics");
}


      

      /* =========================
         FINAL BOOTSTRAP (Version 1 style, includes squad click delegation)
         ========================= */
      document.addEventListener("DOMContentLoaded", () => {
        // Bind elements
        posSelect = document.getElementById("position");
        coreSliders = document.getElementById("coreSliders");
        dynMetrics = document.getElementById("dynamicMetrics");
        weightContainer = document.getElementById("weightingSliders");
        recommendations = document.getElementById("recommendations");

        playerSearchResults = document.getElementById("playerSearchResults");
        searchStatus = document.getElementById("searchStatus");
        playerNameSearch = document.getElementById("playerNameSearch");

        modal = document.getElementById("playerModal");
        modalInner = document.getElementById("modalInner");
        closeModal = document.getElementById("closeModal");

        findBtn = document.getElementById("findPlayersBtn");
        resetBtn = document.getElementById("resetBtn");
        searchBtn = document.getElementById("searchPlayerBtn");

        analyzeSquadBtn = document.getElementById("analyzeSquadBtn");
        targetPlayersBtn = document.getElementById("targetPlayersBtn");

        squadPositionSelect = document.getElementById("squadPositionSelect");

        detailedStatsTable = document.getElementById("detailedStatsTable");
        trainingRegime = document.getElementById("trainingRegime");

        // Safety checks
        if (!posSelect || !coreSliders || !recommendations) {
          console.error("❌ Missing core DOM elements — check your HTML ids.");
          return;
        }

        // ✅ Squad target click delegation (Version 1)
        const gapBox = document.getElementById("gapAnalysisResults");
        if (gapBox) {
          gapBox.addEventListener("click", (e) => {
            const card = e.target.closest(".squad-target");
            if (!card) return;

            const pos = card.dataset.pos;
            const idx = Number(card.dataset.idx);
            const player = lastSquadTargets?.[pos]?.[idx];
            if (!player) return;

            loadPlayerDetails(player);
            switchTab("analytics");
          });
        }

        // Build initial UI + listeners
        try {
          populatePositionOptions();
          buildCoreSliders();
          buildPositionMetrics(posSelect.value);
          buildWeightSliders(posSelect.value);
          setupSliderListeners();
          setupEventListeners();
          handleLoadSavedTargets();
          checkPremiumStatus();
        } catch (e) {
          console.error("❌ Bootstrap failed:", e);
        }
      });
    </script>
  </body>
