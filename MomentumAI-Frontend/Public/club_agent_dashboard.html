<!DOCTYPE html>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #0d1117;
        color: #c9d1d9;
      }
      .attribute-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        background: #21262d;
        outline: none;
        border-radius: 6px;
        transition: opacity 0.12s;
      }
      .attribute-slider:hover {
        opacity: 1;
      }
      .attribute-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #22c55e;
        border-radius: 50%;
        cursor: pointer;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(2, 6, 23, 0.8);
        overflow: auto;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top: 4px solid #22c55e;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .top-five {
        box-shadow: 0 8px 30px rgba(250, 204, 21, 0.08);
        border: 2px solid #facc15;
        transform: scale(1.02);
      }
      .fade-in {
        animation: fadeIn 0.24s ease-in-out both;
      }
      .value-input {
        background: #111827;
        border: 1px solid #374151;
        padding: 8px;
        border-radius: 6px;
        width: 100%;
        color: #c9d1d9;
      }

      /* Tab Styles */
      .tab-button {
        transition: background 0.2s, color 0.2s;
        border-bottom: 2px solid transparent;
      }
      .tab-button.active {
        background: #22c55e;
        color: #0d1117;
        font-weight: 700;
        border-radius: 6px 6px 0 0;
      }
      .tab-pane {
        min-height: 400px;
      }

      /* Reporting Styles */
      table.stats-table th,
      table.stats-table td {
        border-bottom: 1px solid #1f2937;
        padding: 8px 0;
        font-size: 0.875rem;
      }
      table.stats-table th {
        text-align: left;
        color: #a1a1aa;
        font-weight: 400;
      }
      table.projection-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      table.projection-table th,
      table.projection-table td {
        border: 1px solid #2b3138;
        padding: 6px;
        text-align: center;
        font-size: 0.9rem;
      }
      table.projection-table th {
        color: #facc15;
        background: #0f1724;
      }

      .ai-suggestion {
        border-left: 4px solid #facc15;
        background: #111827;
        padding: 12px;
        border-radius: 8px;
      }
      .report-box {
        background: #1f2937;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        border: 1px solid #374151;
      }
      .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
      }
    </style>

      /* --- HELPER FUNCTIONS --- */
      function niceName(key) {
        if (!key) return "";
        return key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function fmtGBPFromEur(eur) {
        if (!eur) return "£0.0M";
        const gbp = eur * 0.85;
        if (gbp >= 1_000_000) return `£${(gbp / 1_000_000).toFixed(2)}M`;
        return `£${(gbp / 1000).toFixed(0)}k`;
      }

      async function safePost(endpoint, body) {
        try {
          const resp = await fetch(BACKEND_BASE + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            mode: "cors",
          });
          if (!resp.ok) throw new Error(`Backend Status ${resp.status}`);
          return await resp.json();
        } catch (err) {
          console.error(err);
          throw err;
        }
      }

      /* --- TAB LOGIC --- */
      function switchTab(targetId) {
        document
          .querySelectorAll(".tab-button")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-pane")
          .forEach((p) => p.classList.add("hidden"));

        const activeBtn = document.querySelector(`[data-tab="${targetId}"]`);
        if (activeBtn) activeBtn.classList.add("active");

        const targetPane = document.getElementById(targetId);
        if (targetPane) targetPane.classList.remove("hidden");
      }

      // Populate the Target Position dropdown
      function populatePositionOptions() {
        const options = [
          ["GK", "Goalkeeper"],
          ["RB", "Right Back"],
          ["LB", "Left Back"],
          ["CB", "Centre Back"],
          ["CDM", "Defensive Midfielder"],
          ["CM", "Midfielder"],
          ["CAM", "Attacking Midfielder"],
          ["RW", "Right Winger"],
          ["LW", "Left Winger"],
          ["CF", "Centre Forward"],
          ["ST", "Striker"],
        ];

        posSelect.innerHTML = options
          .map(([v, label]) => `<option value="${v}">${label}</option>`)
          .join("");
        posSelect.value = "GK";
      }

      // Build the 3 core sliders
      function buildCoreSliders() {
        coreSliders.innerHTML = `
          <div class="fade-in">
            <label class="block text-sm mb-1">Overall: <span id="overallValue" class="text-gray-300">75 - 95</span></label>
            <input type="range" id="overall_min" min="50" max="99" value="75" class="attribute-slider w-full mb-2">
            <input type="range" id="overall_max" min="50" max="99" value="95" class="attribute-slider w-full">
          </div>

          <div class="fade-in">
            <label class="block text-sm mb-1">Age: <span id="ageValue" class="text-gray-300">20 - 30</span></label>
            <input type="range" id="age_min" min="16" max="45" value="20" class="attribute-slider w-full mb-2">
            <input type="range" id="age_max" min="16" max="45" value="30" class="attribute-slider w-full">
          </div>

          <div class="fade-in">
            <label class="block text-sm mb-1">Value (M£): <span id="valueValue" class="text-gray-300">1 - 50</span></label>
            <input type="range" id="value_min" min="0.1" max="999" step="0.1" value="1" class="attribute-slider w-full mb-2">
            <input type="range" id="value_max" min="0.1" max="999" step="0.1" value="50" class="attribute-slider w-full">
          </div>
        `;
      }

      // Build dynamic position metrics sliders
      function buildPositionMetrics(position) {
        const metrics = POSITION_METRICS[position]?.display || [];
        dynMetrics.innerHTML = "";

        metrics.forEach((m) => {
          dynMetrics.innerHTML += `
            <div class="fade-in">
              <label class="block text-sm mb-1">
                ${niceName(m)}: <span id="${m}Value" class="text-gray-300">0 - 99</span>
              </label>
              <input id="${m}_min" class="attribute-slider w-full mb-2" type="range" min="0" max="99" value="0">
              <input id="${m}_max" class="attribute-slider w-full" type="range" min="0" max="99" value="99">
            </div>
          `;
        });
      }

      // Build weight sliders
      function buildWeightSliders(position) {
        const weights = POSITION_METRICS[position]?.weights || [];

        let html = `<h4 class="text-sm font-bold text-gray-300 mb-4">Attribute Weighting</h4>`;

        if (position === "GK") {
          html += `<p class="text-xs text-center text-gray-500">Goalkeeper attributes are not weighted for scouting score.</p>`;
          weightContainer.innerHTML = html;
          return;
        }

        weights.forEach((m) => {
          const spanId = `weight${m.charAt(0).toUpperCase() + m.slice(1)}Value`;
          html += `
            <div class="fade-in">
              <label class="block text-sm mb-1">
                ${niceName(m)} Desire: <span id="${spanId}" class="text-gray-300">0</span>
              </label>
              <input id="weight_${m}" class="attribute-slider w-full" type="range" min="0" max="100" value="0">
            </div>
          `;
        });

        weightContainer.innerHTML = html;
      }

      // Slider listeners + live label updates
      function setupSliderListeners() {
        const sliders = document.querySelectorAll('input[type="range"]');
        sliders.forEach((s) => s.addEventListener("input", updateSliderValues));
        updateSliderValues();
      }

      function clampMinMax(minEl, maxEl) {
        if (!minEl || !maxEl) return;
        if (Number(minEl.value) > Number(maxEl.value)) {
          maxEl.value = minEl.value;
        }
      }

      function updateSliderValues() {
        const corePairs = [
          ["overall_min", "overall_max", "overallValue"],
          ["age_min", "age_max", "ageValue"],
          ["value_min", "value_max", "valueValue"],
        ];

        corePairs.forEach(([minId, maxId, spanId]) => {
          const minEl = document.getElementById(minId);
          const maxEl = document.getElementById(maxId);
          const span = document.getElementById(spanId);
          clampMinMax(minEl, maxEl);
          if (minEl && maxEl && span)
            span.textContent = `${minEl.value} - ${maxEl.value}`;
        });

        document.querySelectorAll('input[id$="_min"]').forEach((minEl) => {
          const maxEl = document.getElementById(
            minEl.id.replace("_min", "_max")
          );
          const span = document.getElementById(
            minEl.id.replace("_min", "Value")
          );

          if (["overall_min", "age_min", "value_min"].includes(minEl.id))
            return;

          clampMinMax(minEl, maxEl);
          if (span && maxEl) span.textContent = `${minEl.value} - ${maxEl.value}`;
        });

        document.querySelectorAll('input[id^="weight_"]').forEach((wEl) => {
          const metric = wEl.id.replace("weight_", "");
          const spanId = `weight${metric.charAt(0).toUpperCase() + metric.slice(1)}Value`;
          const span = document.getElementById(spanId);
          if (span) span.textContent = wEl.value;
        });
      }

      async function handleSquadAnalysis() {
        const box = document.getElementById("gapAnalysisResults");

        if (!squadCsvText) {
          box.innerHTML = `<div class="text-red-400">Please upload a CSV first.</div>`;
          return;
        }

        box.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;

        try {
          const position =
            document.getElementById("squadPositionSelect").value || "ALL";

          const data = await safePost("/squad_gap_analysis", {
            csv_text: squadCsvText,
            position,
          });

          if (!data?.success) {
            box.innerHTML = `<div class="text-red-400">Analysis failed: ${
              data?.message || "Unknown error"
            }</div>`;
            return;
          }

          const sel = document.getElementById("squadPositionSelect");
          if (
            sel &&
            sel.options.length <= 1 &&
            Array.isArray(data.positions_found)
          ) {
            sel.innerHTML =
              `<option value="ALL">Full Squad Audit</option>` +
              data.positions_found
                .map((p) => `<option value="${p}">${p}</option>`)
                .join("");
          }

          const report = data.report || [];
          if (!report.length) {
            box.innerHTML = `<div class="text-yellow-400">No analyzable positions found in the uploaded CSV.</div>`;
            return;
          }

          lastSquadTargets = {};

          box.innerHTML = report
            .map((block) => {
              lastSquadTargets[block.position] = block.targets || [];

              const gapsHtml = (block.gaps || [])
                .map(
                  ([attr, squadAvg, eliteAvg, gap]) => `
                <div class="flex justify-between text-xs border-b border-gray-800 py-1">
                  <span class="text-gray-300">${niceName(attr)}</span>
                  <span class="text-gray-500">Squad ${squadAvg}</span>
                  <span class="text-gray-500">Elite ${eliteAvg}</span>
                  <span class="${
                    gap > 0 ? "text-red-400" : "text-green-400"
                  }">Δ ${gap}</span>
                </div>
              `
                )
                .join("");

              const reasoningHtml = (block.reasoning || [])
                .map((line) => `<div class="text-xs text-gray-300">${line}</div>`)
                .join("");

              const targetsHtml = (block.targets || [])
                .map(
                  (t, idx) => `
                <div
                  class="squad-target flex items-center justify-between p-2 bg-gray-800 border border-gray-700 rounded cursor-pointer hover:border-green-500"
                  data-pos="${block.position}"
                  data-idx="${idx}"
                >
                  <div class="flex items-center gap-2">
                    <img src="${t.player_face_url || ""}" class="w-8 h-8 rounded-full border border-green-500 object-cover" onerror="this.style.display='none'">
                    <div>
                      <div class="text-xs font-bold text-green-300">${t.short_name}</div>
                      <div class="text-[10px] text-gray-500">${t.club_position} • €${Math.round(
                        (t.value_eur || 0) / 1e6
                      )}M</div>
                    </div>
                  </div>
                  <div class="text-sm font-bold text-white">${t.overall || ""}</div>
                </div>
              `
                )
                .join("");

              return `
              <div class="p-4 bg-gray-900 border border-gray-700 rounded-lg">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold text-green-400">${block.position} — Gap Report</div>
                  <div class="text-xs text-gray-400">Squad ${block.squad_score} vs Elite ${block.elite_score}</div>
                </div>

                <div class="mt-2 text-xs text-yellow-300 font-semibold">
                  Recommended Profile: ${block.archetype}
                </div>

                <div class="mt-3">
                  <div class="text-xs text-gray-500 mb-1">Biggest Gaps</div>
                  ${gapsHtml}
                </div>

                <div class="mt-3 ai-suggestion">
                  <div class="text-xs font-bold text-yellow-300 mb-1">AI Reasoning</div>
                  ${reasoningHtml}

                  <div class="text-xs text-gray-500 mb-2">Suggested Targets</div>
                  <div class="space-y-2">
                    ${
                      targetsHtml ||
                      `<div class="text-xs text-gray-500 italic">No targets found.</div>`
                    }
                  </div>
                </div>
              </div>
            `;
            })
            .join("");
        } catch (err) {
          console.error(err);
          box.innerHTML = `<div class="text-red-400">Error connecting to server.</div>`;
        }

      /* --- DATA HANDLERS --- */
      async function handleFindPlayers() {
        recommendations.innerHTML = '<div class="spinner mx-auto"></div>';

        const position = posSelect.value;

        const overallMin = Number(document.getElementById("overall_min").value);
        const overallMax = Number(document.getElementById("overall_max").value);
        const ageMin = Number(document.getElementById("age_min").value);
        const ageMax = Number(document.getElementById("age_max").value);

        // Value sliders are M£ -> convert to EUR (approx)
        const valueMinMgbp = Number(document.getElementById("value_min").value);
        const valueMaxMgbp = Number(document.getElementById("value_max").value);
        const valueMinGbp = valueMinMgbp * 1_000_000;
        const valueMaxGbp = valueMaxMgbp * 1_000_000;
        const valueMinEur = Math.round(valueMinGbp / 0.85);
        const valueMaxEur = Math.round(valueMaxGbp / 0.85);

        const body = {
          position,
          filters: {
            overall: [overallMin, overallMax],
            age: [ageMin, ageMax],
            value_eur: [valueMinEur, valueMaxEur],
          },
          weights: {},
          data_source: "base",
        };

        const metricList = POSITION_METRICS[position]?.display || [];
        metricList.forEach((m) => {
          const minEl = document.getElementById(`${m}_min`);
          const maxEl = document.getElementById(`${m}_max`);
          if (minEl && maxEl) {
            body.filters[m] = [Number(minEl.value), Number(maxEl.value)];
          }
        });

        const weightList = POSITION_METRICS[position]?.weights || [];
        weightList.forEach((m) => {
          const wEl = document.getElementById(`weight_${m}`);
          if (wEl) body.weights[m] = Number(wEl.value);
        });

        try {
          const data = await safePost("/find_players", body);
          recommendations.innerHTML = "";

          if (!data?.players?.length) {
            recommendations.innerHTML =
              '<p class="text-gray-500">No players found.</p>';
            return;
          }

          data.players.forEach((p) =>
            recommendations.appendChild(renderPlayerCard(p))
          );
        } catch (err) {
          console.error(err);
          recommendations.innerHTML =
            '<p class="text-red-500 text-center">Error connecting to scouting server.</p>';
        }
      }

      function renderPlayerCard(player) {
        const attrs = player.full_attributes || {};
        const overall = player.overall ?? attrs.overall ?? "";
        const face = player.player_face_url ?? attrs.player_face_url ?? "";

        const card = document.createElement("div");
        card.className =
          "bg-gray-800 p-4 rounded-xl border border-gray-700 hover:scale-105 transition-transform cursor-pointer";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${face}" class="w-16 h-16 rounded-full border-2 border-green-500 object-cover" onerror="this.style.display='none'">
            <div class="flex-1">
              <div class="font-bold text-green-300">${player.short_name}</div>
              <div class="text-xs text-gray-400">${player.club_position} ${
          overall ? `• OVR ${overall}` : ""
        }</div>
            </div>
          </div>
        `;
        card.onclick = () => loadPlayerDetails(player);
        return card;
      }

      function pickStat(attrs, keys, fallback = 50) {
        for (const k of keys) {
          const v = attrs?.[k];
          if (typeof v === "number" && !Number.isNaN(v)) return v;
        }
        return fallback;
      }

      function loadPlayerDetails(player) {
        document.getElementById(
          "analyticsHeader"
        ).textContent = `${player.short_name} - Advanced Analytics`;

        const attrs = player.full_attributes || {};
        detailedStatsTable.innerHTML =
          `<table class="stats-table w-full"><tbody>` +
          Object.keys(attrs)
            .map((k) => `<tr><th>${niceName(k)}</th><td>${attrs[k]}</td></tr>`)
            .join("") +
          `</tbody></table>`;

        const data = [
          pickStat(attrs, ["pace", "pac"]),
          pickStat(attrs, ["shooting", "sho"]),
          pickStat(attrs, ["passing", "pas"]),
          pickStat(attrs, ["dribbling", "dri"]),
          pickStat(attrs, ["defending", "defence", "def", "dfs"]),
          pickStat(attrs, ["physic", "physicality", "physical", "phy"]),
        ];

        if (currentChart) currentChart.destroy();
        const ctx = document.getElementById("performanceChart").getContext("2d");

        currentChart = new Chart(ctx, {
          type: "radar",
          data: {
            labels: ["PAC", "SHO", "PAS", "DRI", "DEF", "PHY"],
            datasets: [
              {
                label: player.short_name,
                data: data,
                backgroundColor: "rgba(34,197,94,0.2)",
                borderColor: "#22c55e",
              },
            ],
          },
          options: { scales: { r: { suggestedMin: 30, suggestedMax: 100 } } },
        });

        const entitlements = JSON.parse(
          sessionStorage.getItem("momentum_entitlements") ||
            '{"analyst_ai":false}'
        );

        if (entitlements.analyst_ai) {
          const ai = player.ai_training || { weakness: "N/A", drills: [] };
          trainingRegime.innerHTML = `<div class="report-box"><strong>Weakness:</strong> ${ai.weakness}<br><strong>Drills:</strong> ${ai.drills.join(
            ", "
          )}</div>`;
        } else {
          trainingRegime.innerHTML = `<div class="bg-black/50 p-4 rounded text-center">🔒 Upgrade to unlock AI Insights</div>`;
        }

        switchTab("analytics");
      }
